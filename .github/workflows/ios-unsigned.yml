name: Build and release Korttipelit for iOS and Android

on:
  workflow_dispatch:
  push:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK packages
        run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build installable APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/korttipelit-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/korttipelit-release.jks"
          fi
          gradle assembleRelease \
            -PversionName="$version" \
            -PversionCode="$GITHUB_RUN_NUMBER"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release-assets/Korttipelit-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Korttipelit-android-apk
          path: release-assets/Korttipelit-android.apk
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          mkdir -p Generated
          xcodegen generate
      - name: Build unsigned app
        run: |
          app_version="1.0.${GITHUB_RUN_NUMBER}"
          xcodebuild -project ChromeHearts.xcodeproj \
            -scheme ChromeHearts \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            TARGETED_DEVICE_FAMILY=1 \
            PRODUCT_BUNDLE_IDENTIFIER=fi.chromehearts.cards \
            MARKETING_VERSION="$app_version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ChromeHearts.app"
          if [ -f "$GITHUB_WORKSPACE/GoogleService-Info.plist" ]; then
            cp "$GITHUB_WORKSPACE/GoogleService-Info.plist" "$app/GoogleService-Info.plist"
          fi
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/Korttipelit-unsigned.ipa" Payload
      - name: Generate Feather source
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          ipa = Path("Korttipelit-unsigned.ipa")
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          download = "https://github.com/Sisitin10/kortit/releases/latest/download/Korttipelit-unsigned.ipa"
          icon = "https://raw.githubusercontent.com/Sisitin10/kortit/main/Assets.xcassets/AppIcon.appiconset/chromehearts-app-icon.png"
          version = os.environ["APP_VERSION"]
          app = {
              "name": "Korttipelit",
              "bundleIdentifier": "fi.chromehearts.cards",
              "developerName": "Korttipelit",
              "subtitle": "Kakkahousu ja Musta Maija",
              "localizedDescription": "Suomalaiset korttipelit Chrome Hearts -teemaisella korttipakalla.",
              "iconURL": icon,
              "tintColor": "662126",
              "versions": [{"version": version, "date": now, "localizedDescription": f"GitHub Actions build {os.environ['GITHUB_RUN_NUMBER']}", "downloadURL": download, "size": ipa.stat().st_size}],
              "version": version,
              "versionDate": now,
              "size": ipa.stat().st_size,
              "downloadURL": download,
              "appPermissions": {"entitlements": [], "privacy": [{"name": "Camera", "usageDescription": "Skannaa QR-koodi liittyäksesi pelikaverin huoneeseen."}]}
          }
          source = {
              "name": "Korttipelit",
              "identifier": "fi.chromehearts.cards.source",
              "iconURL": icon,
              "website": "https://github.com/Sisitin10/kortit",
              "apps": [app]
          }
          Path("Korttipelit-feather-source.json").write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Add download instructions to run summary
        run: |
          {
            echo '## iOS build ready'
            echo ''
            echo 'Download **Korttipelit-unsigned.ipa** from the Artifacts section below this workflow run.'
            echo ''
            echo 'This IPA is unsigned and cannot be installed directly on an iPhone. Sign it with a valid Apple provisioning profile first.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Korttipelit-ios-release-assets
          path: |
            Korttipelit-unsigned.ipa
            Korttipelit-feather-source.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish iOS and Android releases
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Korttipelit-ios-release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Korttipelit-android-apk
          path: release-assets
      - name: Add download instructions to run summary
        run: |
          {
            echo '## Korttipelit build ready'
            echo ''
            echo '- **Android:** Download `Korttipelit-android.apk` from this release and install it on your phone.'
            echo '- **iOS:** Download `Korttipelit-unsigned.ipa`; it needs signing before installation.'
            echo '- **Feather:** `Korttipelit-feather-source.json`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$GITHUB_WORKSPACE/release-assets/Korttipelit-unsigned.ipa" \
            "$GITHUB_WORKSPACE/release-assets/Korttipelit-android.apk" \
            "$GITHUB_WORKSPACE/release-assets/Korttipelit-feather-source.json" \
            --target "$GITHUB_SHA" \
            --title "Korttipelit build ${GITHUB_RUN_NUMBER}" \
            --notes "Automaattinen iOS- ja Android-julkaisu. iOS-IPA on allekirjoittamaton; Android-APK on asennettava." \
            --latest
