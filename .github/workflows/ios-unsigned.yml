name: Build and release Korttipelit IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          mkdir -p Generated
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project ChromeHearts.xcodeproj \
            -scheme ChromeHearts \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            TARGETED_DEVICE_FAMILY=1 \
            PRODUCT_BUNDLE_IDENTIFIER=fi.chromehearts.cards \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ChromeHearts.app"
          if [ -f "$GITHUB_WORKSPACE/GoogleService-Info.plist" ]; then
            cp "$GITHUB_WORKSPACE/GoogleService-Info.plist" "$app/GoogleService-Info.plist"
          fi
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/Korttipelit-unsigned.ipa" Payload
      - name: Add download instructions to run summary
        run: |
          {
            echo '## iOS build ready'
            echo ''
            echo 'Download **Korttipelit-unsigned.ipa** from the Artifacts section below this workflow run.'
            echo ''
            echo 'This IPA is unsigned and cannot be installed directly on an iPhone. Sign it with a valid Apple provisioning profile first.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Korttipelit-unsigned-ipa
          path: Korttipelit-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_ID}"
          gh release create "$tag" "$GITHUB_WORKSPACE/Korttipelit-unsigned.ipa" \
            --target "$GITHUB_SHA" \
            --title "Korttipelit build ${GITHUB_RUN_NUMBER}" \
            --notes "Automaattinen iOS-build. IPA on allekirjoittamaton." \
            --latest
