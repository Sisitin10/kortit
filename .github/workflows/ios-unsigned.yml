name: Build and release Lautapelit for iOS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          mkdir -p Generated
          xcodegen generate
      - name: Build unsigned app
        run: |
          app_version="1.0.${GITHUB_RUN_NUMBER}"
          xcodebuild -project Lautapelit.xcodeproj \
            -scheme Lautapelit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            TARGETED_DEVICE_FAMILY=1 \
            PRODUCT_BUNDLE_IDENTIFIER=fi.chromehearts.cards \
            MARKETING_VERSION="$app_version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Lautapelit.app"
          if [ -f "$GITHUB_WORKSPACE/GoogleService-Info.plist" ]; then
            cp "$GITHUB_WORKSPACE/GoogleService-Info.plist" "$app/GoogleService-Info.plist"
          fi
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/Lautapelit-unsigned.ipa" Payload
      - name: Generate Feather source
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          ipa = Path("Lautapelit-unsigned.ipa")
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          download = "https://github.com/Sisitin10/kortit/releases/latest/download/Lautapelit-unsigned.ipa"
          icon = "https://raw.githubusercontent.com/Sisitin10/kortit/main/Assets.xcassets/AppIcon.appiconset/chromehearts-app-icon.png"
          version = os.environ["APP_VERSION"]
          app = {
              "name": "Lautapelit",
              "bundleIdentifier": "fi.chromehearts.cards",
              "developerName": "Lautapelit",
              "subtitle": "Suomalaiset peli-illat yhdessä",
              "localizedDescription": "Kakkahousu, Musta Maija ja 5 Sekuntia.",
              "iconURL": icon,
              "tintColor": "662126",
              "versions": [{"version": version, "date": now, "localizedDescription": f"Lautapelit iOS build {os.environ['GITHUB_RUN_NUMBER']}", "downloadURL": download, "size": ipa.stat().st_size}],
              "version": version,
              "versionDate": now,
              "size": ipa.stat().st_size,
              "downloadURL": download,
              "appPermissions": {"entitlements": [], "privacy": [
                  {"name": "Camera", "usageDescription": "Skannaa QR-koodi liittyäksesi pelikaverin huoneeseen."},
                  {"name": "Microphone", "usageDescription": "Tunnista 5 Sekuntia -pelin vastaukset puheesta."},
                  {"name": "SpeechRecognition", "usageDescription": "Litteroi suomenkielinen vastaus 5 Sekuntia -pelin aikana."}
              ]}
          }
          source = {
              "name": "Lautapelit",
              "identifier": "fi.chromehearts.cards.source",
              "iconURL": icon,
              "website": "https://github.com/Sisitin10/kortit",
              "apps": [app]
          }
          Path("Lautapelit-feather-source.json").write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Add download instructions to run summary
        run: |
          {
            echo '## Lautapelit iOS build ready'
            echo ''
            echo 'Download **Lautapelit-unsigned.ipa** from the Artifacts section below this workflow run.'
            echo ''
            echo 'This IPA is unsigned and cannot be installed directly on an iPhone. Sign it with a valid Apple provisioning profile first.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Lautapelit-ios-release-assets
          path: |
            Lautapelit-unsigned.ipa
            Lautapelit-feather-source.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Lautapelit iOS release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lautapelit-ios-release-assets
          path: release-assets
      - name: Add download instructions to run summary
        run: |
          {
            echo '## Lautapelit build ready'
            echo ''
            echo '- **iOS:** Download `Lautapelit-unsigned.ipa`; it needs signing before installation.'
            echo '- **Feather:** `Lautapelit-feather-source.json`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_ID}"
          assets=(
            "$GITHUB_WORKSPACE/release-assets/Lautapelit-unsigned.ipa"
            "$GITHUB_WORKSPACE/release-assets/Lautapelit-feather-source.json"
          )
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Lautapelit build ${GITHUB_RUN_NUMBER}" \
            --notes "Automaattinen Lautapelit iOS-julkaisu. IPA on allekirjoittamaton." \
            --latest
