name: ChromeHearts
options:
  bundleIdPrefix: fi.chromehearts
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ChromeHearts:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Generated/ChromeHearts-Info.plist
      properties:
        UIUserInterfaceStyle: Light
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Skannaa QR-koodi liittyäksesi pelikaverin huoneeseen.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - chromehearts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.chromehearts.cards
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Korttipelit
        INFOPLIST_KEY_FIREBASE_DATABASE_URL: $(FIREBASE_DATABASE_URL)
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
