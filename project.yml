name: ChromeHearts
options:
  bundleIdPrefix: fi.chromehearts
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    GENERATE_INFOPLIST_FILE: YES
targets:
  ChromeHearts:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/ChromeHearts-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - chromehearts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.chromehearts.cards
        INFOPLIST_KEY_CFBundleDisplayName: Chrome Hearts
        INFOPLIST_KEY_NSCameraUsageDescription: Skannaa QR-koodi liittyäksesi pelikaverin huoneeseen.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_FIREBASE_API_KEY: $(FIREBASE_API_KEY)
        INFOPLIST_KEY_FIREBASE_DATABASE_URL: $(FIREBASE_DATABASE_URL)
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
